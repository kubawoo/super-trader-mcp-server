[project]
name = "super-trader"
version = "0.3.0"
description = "MCP Server for traders"
readme = "README.md"
authors = [
    { name = "kuba", email = "kuba@laptop.local.net" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "fastmcp>=4.1.8",
    "pydantic>=2.14.3",
    "starlette>=1.10.0",
    "yfinance>=1.8.0",
]

[project.scripts]
super-trader = "super_trader.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
