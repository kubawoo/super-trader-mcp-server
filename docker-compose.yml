services:
  super-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super-trader-mcp-server
    ports:
      - "${FASTMCP_PORT:-8000}:8000"
    environment:
      - FASTMCP_PORT=8000
      - FASTMCP_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
